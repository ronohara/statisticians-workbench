api:
  user:
    connection_not_found: সংযোগ পাওয়া যায়নি
    invalid_current_password: বর্তমান পাসওয়ার্ডটি ভুল
    example_delete_ai: উদাহরণ ব্যবহারকারীরা AI সংযোগ মুছতে পারে না
    internal_error: অভ্যন্তরীণ সার্ভার ত্রুটি
    example_blocked: উদাহরণ ব্যবহারকারীরা এই কাজটি করতে পারে না
    connection_id_required: সংযোগ আইডি প্রয়োজন
    api_key_required: এই প্রদানকারীর জন্য API কী প্রয়োজন
    invalid_connection_id: অবৈধ সংযোগ আইডি
    example_create_ai: উদাহরণ ব্যবহারকারীরা AI সংযোগ তৈরি করতে পারে না
    invalid_port: পোর্ট অবশ্যই একটি পূর্ণসংখ্যা হতে হবে
    invalid_name: নাম অবশ্যই একটি স্ট্রিং হতে হবে
    example_update_ai: উদাহরণ ব্যবহারকারীরা AI সংযোগ আপডেট করতে পারে না
    missing_fields: প্রয়োজনীয় ক্ষেত্রসমূহ অনুপস্থিত
    provider_not_found: প্রদানকারী "{provider}" পাওয়া যায়নি
    connection_name_exists: এই নামের একটি সংযোগ ইতিমধ্যে বিদ্যমান
    user_not_found: ব্যবহারকারী পাওয়া যায়নি
    tuning_model_not_found: এমন কোনো মডেল নেই
    test_connect_refused: ওই ঠিকানায় কিছুই লিসেন করছে না — সার্ভারে পৌঁছানো যাচ্ছে কিন্তু কোনো সার্ভিস সাড়া দেয়নি। পোর্ট এবং AI সার্ভার চলছে কিনা তা পরীক্ষা করুন। কোনো সক্ষমতার রায় রেকর্ড করা হয়নি;
      ব্যর্থ হতে কত সময় লেগেছিল তা রেকর্ড করা হয়েছে।
    connect_timeout_exceeds_probe: সংযোগ টাইমআউট ({connect} সেকেন্ড) পরীক্ষার টাইমআউট ({probe} সেকেন্ড)-এর চেয়ে বেশি হতে পারবে না — পুরো পরীক্ষা যতক্ষণ চলতে পারে, একটি সংযোগ স্থাপনে তার চেয়ে বেশি সময়
      নেওয়ার অনুমতি দেওয়া যায় না।
    test_attribution_required: একটি পরীক্ষার ফলাফলে কে এটি চালিয়েছে তা অবশ্যই রেকর্ড করতে হবে।
    tuning_malformed_body: অনুরোধের বডি বৈধ JSON নয়।
    unknown_test_id: 'অজানা পরীক্ষা "{test}"। নিবন্ধিত পরীক্ষাগুলো: {known}'
    model_not_found: প্রদানকারী "{provider}"-এর জন্য মডেল "{model}" পাওয়া যায়নি।
    test_dns_failure: এন্ডপয়েন্টের হোস্টনেম রেজলভ করা যায়নি। ঠিকানায় কোনো টাইপো আছে কিনা, বা এটি এমন কোনো নাম কিনা যা শুধুমাত্র এই নেটওয়ার্ক রেজলভ করতে পারে, তা পরীক্ষা করুন। কোনো সক্ষমতার রায় রেকর্ড
      করা হয়নি; ব্যর্থ হতে কত সময় লেগেছিল তা রেকর্ড করা হয়েছে।
    test_connect_timeout: এন্ডপয়েন্ট সময়মতো সংযোগ গ্রহণ করেনি। হোস্টটি ডাউন থাকতে পারে, অথবা কোনো ফায়ারওয়াল অনুরোধটি বাদ দিচ্ছে। কোনো সক্ষমতার রায় রেকর্ড করা হয়নি; ব্যর্থ হতে কত সময় লেগেছিল তা রেকর্ড
      করা হয়েছে।
    tuning_invalid_temperature: টেম্পারেচার অবশ্যই ০ থেকে ২-এর মধ্যে একটি সংখ্যা হতে হবে।
    invalid_test_state: 'অবৈধ পরীক্ষার ফলাফল "{state}"। অনুমোদিত: {allowed}'
    test_reason_required: একটি পরীক্ষার ফলাফলে একটি কারণ অবশ্যই রেকর্ড করতে হবে।
    test_http_status: 'প্রদানকারী উত্তর দিয়েছে, এবং তার উত্তরটি ছিল একটি ত্রুটি: {detail}। কোনো সক্ষমতার রায় রেকর্ড করা হয়নি; কারণটি স্পষ্ট করার জন্য প্রদানকারী যা বলেছে তা দেখানো হয়েছে।'
    tuning_invalid_ai_timeout: AI সময়সীমা অবশ্যই পূর্ণসংখ্যার সেকেন্ড হতে হবে, কমপক্ষে ১।
    test_read_timeout: মডেলটি অনুরোধ গ্রহণ করেছিল কিন্তু সময়মতো উত্তর দেয়নি। এটি এই হোস্টের জন্য খুব ধীর হতে পারে — CPU-তে একটি বড় মডেল কয়েক মিনিট নিতে পারে। কোনো সক্ষমতার রায় রেকর্ড করা হয়নি; ব্যর্থ
      হতে কত সময় লেগেছিল তা রেকর্ড করা হয়েছে।
    test_budget_exhausted: মডেলটি কিছুই ফেরত দেয়নি কারণ এটি উত্তরে পৌঁছানোর আগেই তার পুরো আউটপুট বাজেট ব্যবহার করে ফেলেছিল। কোনো সক্ষমতার রায় রেকর্ড করা হয়নি; সময়কাল রেকর্ড করা হয়েছিল।
    tuning_connection_not_found: এমন কোনো AI সংযোগ নেই।
    model_not_served_by_connection: এই সংযোগটি "{model}" মডেলটি পরিবেশন করে না। এর মডেলগুলো পরিবর্তিত হয়ে থাকতে পারে — সংযোগটি রিফ্রেশ করুন, অথবা অন্য একটি মডেল বেছে নিন।
    invalid_connect_timeout: সংযোগ টাইমআউট অবশ্যই পূর্ণসংখ্যার সেকেন্ড হতে হবে, কমপক্ষে ১ এবং সর্বোচ্চ {ceiling}।
    tuning_nothing_to_update: temperature, maxTokens অথবা timeoutSeconds-এর মধ্যে কমপক্ষে একটি সরবরাহ করুন।
    test_tls_failure: নিরাপদ সংযোগ স্থাপন করা যায়নি — এন্ডপয়েন্টটি হয়তো যেখানে https প্রত্যাশিত ছিল সেখানে সাধারণ http, অথবা এর সার্টিফিকেটের মেয়াদ শেষ হয়ে থাকতে পারে। কোনো সক্ষমতার রায় রেকর্ড করা
      হয়নি; ব্যর্থ হতে কত সময় লেগেছিল তা রেকর্ড করা হয়েছে।
    test_not_implemented: পরীক্ষা "{test}" নিবন্ধিত কিন্তু এখনও কোনো প্রোব নেই।
