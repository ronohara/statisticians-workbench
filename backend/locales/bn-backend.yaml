dbdesign:
  analysis:
    data_types:
      add_check_constraint: '''{column}''-এর জন্য একটি CHECK কনস্ট্রেইন্ট যোগ করুন অথবা সীমিত বৈধ মানের জন্য ENUM টাইপ ব্যবহার করুন।'
      add_not_null: '''{column}''-এ NOT NULL কনস্ট্রেইন্ট যোগ করুন।'
      allows_null: কলাম '{column}' NULL মান গ্রহণ করে — NOT NULL সীমাবদ্ধতা বিবেচনা করুন
      set_max_length: অতিরিক্ত বড় ডেটা প্রতিরোধ করতে '{column}'-এর জন্য সর্বোচ্চ দৈর্ঘ্য নির্ধারণের কথা বিবেচনা করুন।
      short_text_enum: টেক্সট কলাম '{column}'-এর সর্বোচ্চ দৈর্ঘ্য {max_len} — ENUM বা CHECK সীমাবদ্ধতা ব্যবহারের কথা বিবেচনা করুন
      unbounded_varchar: সীমাহীন VARCHAR কলাম '{column}'
    indexing:
      missing_fk_index: ফরেন কি কলাম '{column}'-এর কোনো ইনডেক্স নেই।
    naming:
      mixed_case_column: কলাম '{column}' বড় ও ছোট হাতের অক্ষরের মিশ্রণ ব্যবহার করে — snake_case সুপারিশ করা হয়েছে
      mixed_case_table: টেবিলের নাম '{table}' বড় ও ছোট হাতের অক্ষরের মিশ্রণ ব্যবহার করে — snake_case সুপারিশ করা হয়েছে
      rename_column_reserved: SQL সংরক্ষিত শব্দের দ্বন্দ্ব এড়াতে কলাম '{column}' পুনঃনামকরণ করুন।
      rename_column_snake_case: সামঞ্জস্যের জন্য কলামকে lowercase snake_case-এ পুনঃনামকরণ করুন।
      rename_table_reserved: SQL সংরক্ষিত শব্দের দ্বন্দ্ব এড়াতে টেবিল '{table}' পুনঃনামকরণ করুন।
      rename_table_snake_case: সামঞ্জস্যের জন্য টেবিলকে lowercase snake_case-এ পুনঃনামকরণ করুন।
      reserved_keyword_column: কলাম '{column}' একটি সংরক্ষিত SQL কীওয়ার্ড।
      reserved_keyword_table: টেবিলের নাম '{table}' একটি সংরক্ষিত SQL কীওয়ার্ড।
    normalisation:
      create_separate_table: '{table}-এ FK সহ ''{base}'' মানগুলির জন্য একটি পৃথক টেবিল তৈরি করুন।'
      multiple_address: একাধিক ঠিকানা-সম্পর্কিত কলাম ({count}) সনাক্ত হয়েছে।
      repeating_group: 'পুনরাবৃত্ত গ্রুপ সনাক্ত হয়েছে: {columns}'
      separate_address_table: '{table}-এ FK সহ একটি পৃথক ঠিকানা টেবিল তৈরির কথা বিবেচনা করুন।'
    relationships:
      add_fk: যদি '{column}' অন্য কোনো টেবিলকে নির্দেশ করে, তাহলে একটি FK কনস্ট্রেইন্ট যোগ করার কথা বিবেচনা করুন।
      missing_fk: কলাম '{column}' দেখতে একটি ফরেন কি-এর মতো কিন্তু এর কোনো FK কনস্ট্রেইন্ট নেই।
    semistructured:
      controlled_vocab: কলাম {column}-এ {count}টি স্বতন্ত্র মানের একটি নিয়ন্ত্রিত শব্দভাণ্ডার রয়েছে।
      create_ref_table: '{table} টেবিল স্বাভাবিকীকরণ করতে {column} মানগুলির জন্য একটি রেফারেন্স টেবিল তৈরি করুন।'
