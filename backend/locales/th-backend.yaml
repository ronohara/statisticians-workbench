    tuning_invalid_temperature: อุณหภูมิต้องเป็นตัวเลขระหว่าง 0 ถึง 2
    test_not_implemented: การทดสอบ "{test}" ถูกลงทะเบียนแล้ว แต่ยังไม่มีโพรบ
    model_not_found: ไม่พบโมเดล "{model}" สำหรับผู้ให้บริการ "{provider}"
    test_dns_failure: ไม่สามารถแปลงชื่อโฮสต์ของปลายทางได้ ตรวจสอบที่อยู่ว่าพิมพ์ผิดหรือไม่ หรือเป็นชื่อที่เครือข่ายนี้เท่านั้นที่แปลงได้ ไม่มีการบันทึกผลการตัดสินความสามารถ แต่บันทึกระยะเวลาที่ใช้จนล้มเหลว
    model_not_served_by_connection: การเชื่อมต่อนี้ไม่ได้ให้บริการ "{model}" โมเดลของมันอาจเปลี่ยนแปลงแล้ว — โปรดรีเฟรชการเชื่อมต่อ หรือเลือกโมเดลอื่น
    tuning_model_not_found: ไม่มีโมเดลดังกล่าว
    tuning_invalid_ai_timeout: ขีดจำกัดเวลาของ AI ต้องเป็นจำนวนเต็มวินาที อย่างน้อย 1
    tuning_invalid_max_tokens: ขีดจำกัดผลลัพธ์ต้องเป็นจำนวนเต็มโทเคน อย่างน้อย 1
    tuning_connection_not_found: ไม่มีการเชื่อมต่อ AI ดังกล่าว
    test_read_timeout: โมเดลยอมรับคำขอแล้วแต่ไม่ตอบกลับทันเวลา อาจช้าเกินไปสำหรับโฮสต์นี้ — โมเดลขนาดใหญ่บนซีพียูอาจใช้เวลาหลายนาที ไม่มีการบันทึกผลการตัดสินความสามารถ แต่บันทึกระยะเวลาที่ใช้จนล้มเหลว
    connect_timeout_exceeds_probe: ระยะหมดเวลาเชื่อมต่อ ({connect} วินาที) ต้องไม่นานกว่าระยะหมดเวลาของการทดสอบ ({probe} วินาที) — การเชื่อมต่อไม่สามารถใช้เวลาสร้างนานกว่าระยะเวลาทั้งหมดที่การทดสอบอาจทำงานได้
    test_connect_timeout: ปลายทางไม่ยอมรับการเชื่อมต่อทันเวลา โฮสต์อาจล่ม หรือไฟร์วอลล์อาจทิ้งคำขอ ไม่มีการบันทึกผลการตัดสินความสามารถ แต่บันทึกระยะเวลาที่ใช้จนล้มเหลว
    test_connect_refused: ไม่มีบริการใดรอรับอยู่ที่ที่อยู่นั้น — เซิร์ฟเวอร์เข้าถึงได้แต่ไม่มีบริการตอบกลับ ตรวจสอบพอร์ตและว่าเซิร์ฟเวอร์ AI กำลังทำงานอยู่ ไม่มีการบันทึกผลการตัดสินความสามารถ แต่บันทึกระยะเวลาที่ใช้จนล้มเหลว
    invalid_connect_timeout: ระยะหมดเวลาเชื่อมต่อต้องเป็นจำนวนเต็มวินาที อย่างน้อย 1 และไม่เกิน {ceiling}
    test_attribution_required: ผลการทดสอบต้องบันทึกผู้ที่ทำการทดสอบ
    invalid_test_state: 'ผลการทดสอบไม่ถูกต้อง "{state}" ค่าที่อนุญาต: {allowed}'
    unknown_test_id: 'ไม่รู้จักการทดสอบ "{test}" การทดสอบที่ลงทะเบียนไว้: {known}'
    tuning_nothing_to_update: ระบุอย่างน้อยหนึ่งรายการจาก temperature, maxTokens หรือ timeoutSeconds
    test_tls_failure: ไม่สามารถสร้างการเชื่อมต่อที่ปลอดภัยได้ — ปลายทางอาจเป็น http ธรรมดาในขณะที่คาดหวัง https หรือใบรับรองอาจหมดอายุแล้ว ไม่มีการบันทึกผลการตัดสินความสามารถ แต่บันทึกระยะเวลาที่ใช้จนล้มเหลว
    discovery_complete: 'ค้นพบโมเดล {seen} รายการ: ใหม่ที่นี่ {created} รายการ รู้จักอยู่แล้ว {refreshed} รายการ เลิกให้บริการแล้ว {pruned} รายการ'
    tuning_malformed_body: เนื้อหาคำขอไม่ใช่ JSON ที่ถูกต้อง
    invalid_probe_timeout: ระยะหมดเวลาของการทดสอบต้องเป็นจำนวนเต็มวินาที อย่างน้อย 1 และไม่เกิน {ceiling}
    test_budget_exhausted: โมเดลไม่ส่งคืนผลลัพธ์ใดเลย เนื่องจากใช้ขีดจำกัดผลลัพธ์ทั้งหมดก่อนจะได้คำตอบ ไม่มีการบันทึกผลการตัดสินความสามารถ แต่บันทึกระยะเวลาที่ใช้
